<style>
/* Canlı panoya özgü görünüm; ortak öğeler (renkler, üst şerit, göstergeler, kartlar, çipler) ortak.css'te. */
.goruntu{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0a0f1d;isolation:isolate}

.katman polygon.p-bos{color:#c2cbe0;fill:currentColor;fill-opacity:.06;stroke:currentColor;stroke-dasharray:7 6;stroke-width:2}
.katman polygon.p-dolu{color:#56b4e9;fill:currentColor;stroke:currentColor}

.katman polygon.p-kirli{color:#e48fcb;stroke:currentColor;fill-opacity:1}
.katman polygon.p-bilinmiyor{color:#c2cbe0;fill:none;stroke:currentColor;stroke-dasharray:2 5}
.etk{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;background:rgba(10,14,28,.82);color:#fff;border-radius:8px;padding:3px 8px 3px 6px;font-size:12.5px;line-height:1.3;white-space:nowrap;border:1.5px solid;transition:border-color .4s}

ul.uyarilar .u-ik .ik{width:16px;height:16px}
ul.uyarilar .u-ik.bek{color:var(--s-bek)}ul.uyarilar .u-ik.kir{color:var(--s-kir)}ul.uyarilar .u-ik.kas{color:var(--s-dolu)}ul.uyarilar .u-ik.ter{color:var(--err)}

.kam-izgara{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.kam-kart{border:1px solid var(--cizgi);border-radius:14px;background:var(--kart2);overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:block;width:100%;transition:border-color .2s,transform .2s}
.kam-kart:hover{border-color:var(--soluk)}
.kam-kart .goruntu{border-radius:0}

<script>
"use strict";
/* ============================================================ yardımcılar (ortak.js: KK) */
const {$,esc,ik,sayi,pad,sure,kisaSure,say,yuzde,dogal}=KK;

const Q=new URLSearchParams(location.search);
const DEMO=(Q.has("demo")&&Q.get("demo")!=="0")||location.protocol==="file:";
if(DEMO)$("ornekRozet").classList.remove("gizli");

const DURUM_MASA={
  bekliyor:{ad:"Bekliyor",ik:"zil",sira:0},
  kirli:{ad:"Kirli",ik:"kirli",sira:1},
  dolu:{ad:"Dolu",ik:"dolu",sira:2},
  bos:{ad:"Boş",ik:"bos",sira:3},
};
const masaDurum=d=>DURUM_MASA[d]?d:"bilinmiyor";
const masaBilgi=d=>DURUM_MASA[d]||{ad:"Bilinmiyor",ik:"bilgi",sira:4};

/* Kamera durumu → önem: ok / warn / err / off */
const ESKI_SN=10;
function kameraDurum(k){
  const yas=kareYasi(k);
  switch(k.durum){
    case "calisiyor":
      if(sayi(yas)&&yas>=ESKI_SN)return {sev:"warn",ad:"Görüntü gecikiyor",uzun:`Son kare ${sure(yas)} önce analiz edildi`};
      return {sev:"ok",ad:"Canlı",uzun:"Canlı"};
    case "baglaniyor":return {sev:"warn",ad:"Bağlanıyor",uzun:"Kameraya bağlanılıyor"};
    case "koptu":return {sev:"warn",ad:"Bağlantı koptu",uzun:"Bağlantı koptu, yeniden deneniyor"};
    case "durdu":return {sev:"off",ad:"Durduruldu",uzun:"İzleme durduruldu"};
    case "hata":return {sev:"err",ad:"Hata",uzun:"Analizde hata"};
    default:return {sev:"warn",ad:"Durum bilinmiyor",uzun:"Kamera durumu bilinmiyor"};
  }
}
const SEV_SIRA={ok:0,off:1,warn:2,err:3};

/* ============================================================ durum */
const S={veri:null,alindi:0,hata:null,ardisikHata:0,secim:null,anahtar:"",gorulenUyari:new Set(),ilkUyari:true};
const SONKARE=new Map();   // kod -> {url,w,h,t}: son iyi kare, görünüm değişince hemen gösterilir
let CERCEVELER=[];        // ekrandaki görüntü bileşenleri

function normal(v){
  const d=v&&typeof v==="object"?v:{};
  const kam=Array.isArray(d.kameralar)?d.kameralar:[];
  return {zaman:d.zaman||null,kameralar:kam.filter(k=>k&&k.kod!=null).map(k=>({
    kod:String(k.kod),ad:k.ad||String(k.kod),durum:k.durum||null,mesaj:k.mesaj||"",
    onizleme:k.onizleme||`/api/canli/onizleme/${encodeURIComponent(k.kod)}`,
    genislik:sayi(k.genislik)&&k.genislik>0?k.genislik:null,yukseklik:sayi(k.yukseklik)&&k.yukseklik>0?k.yukseklik:null,
    son_kare_sn:sayi(k.son_kare_sn)?k.son_kare_sn:null,
    simdi:k.simdi&&typeof k.simdi==="object"?k.simdi:{},
    masalar:(Array.isArray(k.masalar)?k.masalar:[]).filter(Boolean).map((m,i)=>({ad:m.ad||`Masa ${i+1}`,durum:m.durum||null,kisi:sayi(m.kisi)?m.kisi:null,sure_sn:sayi(m.sure_sn)?m.sure_sn:null,bolge:Array.isArray(m.bolge)?m.bolge.filter(p=>Array.isArray(p)&&sayi(p[0])&&sayi(p[1])):[]})),
    kasa:k.kasa&&typeof k.kasa==="object"?k.kasa:null,
    analiz_fps:k.analiz_fps&&typeof k.analiz_fps==="object"?k.analiz_fps:null,
    bugun:k.bugun&&typeof k.bugun==="object"?k.bugun:{},
    saatlik:(Array.isArray(k.saatlik)?k.saatlik:[]).filter(s=>s&&sayi(s.saat)),
    uyarilar:(Array.isArray(k.uyarilar)?k.uyarilar:[]).filter(Boolean),
  }))};
}
/* Son karenin şimdiki yaşı: sunucunun verdiği yaş + yanıt geldiğinden beri geçen süre */
function kareYasi(k){return sayi(k.son_kare_sn)?k.son_kare_sn+(Date.now()-S.alindi)/1000:null}
function apiKoptu(){return S.hata&&(!S.alindi||Date.now()-S.alindi>6000)}

/* ============================================================ veri çekme */
async function cek(){
  if(DEMO)return DEMO_API();
  const ac=new AbortController(),zt=setTimeout(()=>ac.abort(),5000);
  try{
    const r=await fetch("/api/canli",{cache:"no-store",signal:ac.signal});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();
  }finally{clearTimeout(zt)}
}
async function dongu(){
  try{const v=await cek();S.veri=normal(v);S.alindi=Date.now();S.hata=null;S.ardisikHata=0}
  catch(e){S.hata=e;S.ardisikHata++}
  try{ciz()}catch(e){console.error(e)}
  setTimeout(dongu,2000);
}

/* ============================================================ çizim */
function secimiDuzelt(){
  const k=S.veri.kameralar;
  const istek=S.secim||decodeURIComponent(location.hash.slice(1))||null;
  if(istek==="tum"&&k.length>1)S.secim="tum";
  else if(istek&&k.some(x=>x.kod===istek))S.secim=istek;
  else S.secim=k.length>1?"tum":(k[0]&&k[0].kod);
}
function sec(kod){
  S.secim=kod;
  try{history.replaceState(null,"","#"+encodeURIComponent(kod))}catch(e){}
  ciz();window.scrollTo({top:0,behavior:"smooth"});
}
function ciz(){
  gostergeCiz();
  const ana=$("ana");
  if(!S.veri){
    if(S.hata&&S.ardisikHata>=2){S.anahtar="hata";ana.innerHTML=`<div class="kart ortada"><div class="buyuk-ik">${ik("uyari")}</div><h1>Programa ulaşılamıyor</h1><p>Kafe Kamera kapatılmış ya da yeniden başlıyor olabilir. Pano her 2 saniyede yeniden deniyor.</p><a class="dug ana" href="/#kurulum">${ik("ayar")}Kurulum</a></div>`}
    $("secici").classList.add("gizli");return;
  }
  const kam=S.veri.kameralar;
  if(!kam.length){
    $("secici").classList.add("gizli");
    if(S.anahtar!=="bos"){S.anahtar="bos";CERCEVELER=[];
      ana.innerHTML=`<div class="kart ortada"><div class="buyuk-ik">${ik("kamera-yok")}</div><h1>İzleme çalışmıyor</h1><p>Şu anda canlı izlenen bir kamera yok. Kameralar bölümünden bir kamera ekleyin ya da duraklatılmış izlemeyi sürdürün; eklenen kameralar panoya kendiliğinden gelir.</p><a class="dug ana" href="/#kameralar">${ik("kamera")}Kameralar'a git</a></div>`}
    return;
  }
  secimiDuzelt();
  seciciCiz(kam);
  const anahtar=S.secim+"|"+kam.map(k=>k.kod).join(",");
  if(anahtar!==S.anahtar){S.anahtar=anahtar;S.ilkUyari=true;S.gorulenUyari=new Set();iskeletKur()}
  ana.classList.toggle("solgun",!!apiKoptu());
  if(S.secim==="tum")genelGuncelle(kam);else tekGuncelle(kam.find(k=>k.kod===S.secim));
  tik();
}

function gostergeCiz(){
  const el=$("canli"),serit=$("serit");
  let sev="bekle",metin="Bağlanıyor…",seritHtml="";
  if(apiKoptu()){
    sev="err";metin="Sunucu yanıt vermiyor";
    seritHtml=`${ik("uyari")}<div>Programa ulaşılamıyor, yeniden deneniyor.<small>${S.alindi?"Ekrandaki veriler son başarılı yanıttan kalma.":"Kafe Kamera kapatılmış olabilir."}</small></div>`;
  }else if(S.veri){
    const kam=S.veri.kameralar;
    if(!kam.length){sev="off";metin="İzleme yok"}
    else{
      const gor=S.secim==="tum"||!S.secim?kam:kam.filter(k=>k.kod===S.secim);

      const kotu=d.filter(x=>x.d.sev!=="ok").sort((a,b)=>SEV_SIRA[b.d.sev]-SEV_SIRA[a.d.sev]);
      if(!kotu.length){sev="ok";metin=gor.length>1?"Tüm kameralar canlı":"Canlı"}
      else{
        const en=kotu[0];sev=en.d.sev;
        metin=gor.length>1?(kotu.length===1?`${en.k.ad}: ${en.d.ad.toLocaleLowerCase("tr")}`:`${kotu.length} kamerada sorun`):en.d.uzun;
        seritHtml=`${ik(sev==="off"?"durdu":"uyari")}<div>${kotu.map(x=>`<span>${esc(x.k.ad)}</span> · ${esc(x.d.uzun)}${x.k.mesaj?` <small>${esc(x.k.mesaj)}</small>`:""}`).join("<br>")}</div>`;
      }
    }

}

/* --------------------------------------------- görüntü bileşeni */
function cerceveYap(k,kucuk){
  const el=document.createElement("div");el.className="goruntu"+(kucuk?" kucuk":"");
  const pid="tarama-"+Math.random().toString(36).slice(2,8);
  el.innerHTML=`<img alt="${esc(k.ad)} kamerasından son görüntü (yüzler gizli)"><svg class="katman" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="${pid}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#e48fcb" fill-opacity=".14"/><line x1="0" y1="0" x2="0" y2="9" stroke="#e48fcb" stroke-width="3.5" stroke-opacity=".75"/></pattern></defs><g></g></svg><div class="etiketler"></div><div class="bekle">${ik("kamera-yok")}<span>Görüntü bekleniyor</span></div><div class="yas">${ik("saat")}<span></span></div>`;
  const f={kod:k.kod,el,img:el.querySelector("img"),g:el.querySelector("svg g"),svg:el.querySelector("svg"),et:el.querySelector(".etiketler"),yas:el.querySelector(".yas"),pid,kucuk,yukleniyor:false,son:0,imza:""};
  const s=SONKARE.get(k.kod);
  if(s){f.img.src=s.url;el.classList.add("var");f.son=s.t}
  CERCEVELER.push(f);
  return f;
}
function boyut(k){
  const s=SONKARE.get(k.kod);
  const w=k.genislik||(s&&s.w)||1600,h=k.yukseklik||(s&&s.h)||900;
  return {w,h};
}
function katmanCiz(f,k){
  const {w,h}=boyut(k);
  f.el.style.aspectRatio=`${w} / ${h}`;
  f.svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  const masalar=k.masalar.filter(m=>m.bolge.length>=3);
  const imza=w+"x"+h+"|"+masalar.map(m=>m.ad+":"+m.durum+":"+m.bolge.join(";")).join("|");
  if(imza!==f.imza){
    f.imza=imza;
    f.g.innerHTML=masalar.map(m=>{
      const d=masaDurum(m.durum);
      const pts=m.bolge.map(p=>`${(p[0]*w).toFixed(1)},${(p[1]*h).toFixed(1)}`).join(" ");
      return `<polygon class="p-${d}" points="${pts}"${d==="kirli"?` fill="url(#${f.pid})"`:""}><title>${esc(m.ad)} · ${masaBilgi(m.durum).ad}</title></polygon>`;
    }).join("");
    f.et.innerHTML=masalar.map(m=>{
      const d=masaDurum(m.durum),b=masaBilgi(m.durum);
      const cx=m.bolge.reduce((a,p)=>a+p[0],0)/m.bolge.length,cy=m.bolge.reduce((a,p)=>a+p[1],0)/m.bolge.length;
      const sureEl=d==="bos"||d==="bilinmiyor"?"":`<span data-sure="${sayi(m.sure_sn)?m.sure_sn:""}" data-kod="${esc(k.kod)}"></span>`;
      return `<div class="etk e-${d}" style="left:${(cx*100).toFixed(2)}%;top:${(cy*100).toFixed(2)}%" title="${esc(b.ad)}">${ik(b.ik)}<b>${esc(m.ad)}</b>${sureEl}</div>`;
    }).join("");
  }else{
    // yalnızca süreleri tazele
    const els=f.et.querySelectorAll("[data-sure]");let i=0;
    masalar.forEach(m=>{const d=masaDurum(m.durum);if(d!=="bos"&&d!=="bilinmiyor"&&els[i]){els[i].dataset.sure=sayi(m.sure_sn)?m.sure_sn:"";i++}});
  }
}
/* Yeni kare ekran dışında yüklenir; yüklenince değiştirilir. Hata olursa son iyi kare kalır. */
function kareYukle(f){
  const k=S.veri&&S.veri.kameralar.find(x=>x.kod===f.kod);if(!k)return;
  let url;
  if(DEMO){url=DEMO_KARE(f.kod);if(!url)return}
  else url=k.onizleme+(k.onizleme.includes("?")?"&":"?")+"t="+Date.now();
  f.yukleniyor=true;
  const im=new Image();
  const bitti=()=>{f.yukleniyor=false};
  im.onload=async()=>{
    try{if(im.decode)await im.decode()}catch(e){}
    f.img.src=url;f.el.classList.add("var");f.son=Date.now();
    SONKARE.set(f.kod,{url,w:im.naturalWidth,h:im.naturalHeight,t:f.son});
    if(!k.genislik)katmanCiz(f,k);
    bitti();
  };
  im.onerror=bitti;
  setTimeout(bitti,8000);
  im.src=url;
}
setInterval(()=>{if(document.hidden)return;CERCEVELER.forEach(f=>{if(!f.yukleniyor&&f.el.isConnected)kareYukle(f)})},1000);

/* Analiz hızı: "Analiz: 3 kare/sn"; ölçülen hedefin %70'inin altındaysa "Analiz: 1,8 / 3 kare/sn" (sarı uyarı) */
const fpsSay=v=>(Math.round(v*10)/10).toLocaleString("tr-TR",{maximumFractionDigits:1});
function fpsHtml(k){
  const f=k.analiz_fps;if(!f||!sayi(f.hedef)||f.hedef<=0)return "";
  const dusuk=sayi(f.gercek)&&f.gercek<f.hedef*.7&&k.durum==="calisiyor";
  return `<span class="fps${dusuk?" dusuk":""}" title="${dusuk?"Bilgisayar seçilen analiz hızına yetişemiyor":"Saniyede analiz edilen kare"}${sayi(f.gercek)?` · ölçülen ${fpsSay(f.gercek)} kare/sn`:""}">${dusuk?ik("uyari"):""}Analiz: ${dusuk?`${fpsSay(f.gercek)} / ${fpsSay(f.hedef)}`:fpsSay(f.hedef)} kare/sn</span>`;
}

/* --------------------------------------------- tek kamera */
function tile(o){
  return `<div class="tile ${o.cls||""}"><div class="t-bas">${ik(o.ik)}${o.bas}</div><div class="t-deger ${o.orta?"orta":""}">${o.deger}</div><div class="t-alt">${o.alt||"&nbsp;"}</div>${o.cubuk!=null?`<div class="cubuk"><i style="width:${o.cubuk}%"></i></div>`:""}</div>`;
}
function masaOzet(masalar){
  const say_={bos:0,dolu:0,bekliyor:0,kirli:0,bilinmiyor:0};
  masalar.forEach(m=>say_[masaDurum(m.durum)]++);
  const bilinen=masalar.length-say_.bilinmiyor;
  return {...say_,toplam:masalar.length,dolu_toplam:say_.dolu+say_.bekliyor,bilinen};
}
function enUzunBekleyen(liste){
  let en=null;
  liste.forEach(({m,k})=>{if(m.durum==="bekliyor"&&(!en||(m.sure_sn??-1)>(en.m.sure_sn??-1)))en={m,k}});
  return en;
}
function kpiCiz(o){
  const t=[];
  t.push(tile({ik:"musteri",bas:"Şu an müşteri",deger:say(o.musteri),alt:sayi(o.kisi)?`Toplam ${say(o.kisi)} kişi`:""}));
  t.push(tile({ik:"calisan",bas:"Şu an çalışan",deger:say(o.calisan),alt:o.calisanAlt||""}));
  if(o.ozet.toplam){
    const doluluk=o.ozet.bilinen?Math.round(100*o.ozet.dolu_toplam/o.ozet.toplam):null;
    const alt=[o.ozet.kirli?`${o.ozet.kirli} kirli`:"",o.ozet.bekliyor?`${o.ozet.bekliyor} bekliyor`:"",doluluk!=null?`doluluk ${yuzde(doluluk)}`:""].filter(Boolean).join(" · ");
    t.push(tile({ik:"masa",bas:"Dolu masa",deger:o.ozet.bilinen?`${o.ozet.dolu_toplam}<small>/ ${o.ozet.toplam}</small>`:"–",alt,cubuk:doluluk}));
  }else t.push(tile({ik:"masa",bas:"Dolu masa",deger:"–",alt:"Bu görüntüde masa tanımlı değil"}));
  t.push(tile({ik:"saat",bas:"Ort. kalış (bugün)",deger:sure(o.ortKalis),orta:true,alt:sayi(o.oturum)?`${say(o.oturum)} oturum`:""}));
  if(o.ozet.toplam||o.bekleyen){
    if(o.bekleyen){
      const canli=o.bekleyen.k.durum==="calisiyor";
      t.push(tile({cls:"dikkat",ik:"zil",bas:"En uzun bekleyen",orta:true,deger:`<span data-sure="${sayi(o.bekleyen.m.sure_sn)?o.bekleyen.m.sure_sn:""}" data-kod="${esc(o.bekleyen.k.kod)}">${sure(o.bekleyen.m.sure_sn)}</span>`,alt:esc(o.bekleyen.m.ad)+(o.cokKamera?` · ${esc(o.bekleyen.k.ad)}`:"")+" · kimse gitmedi"}));
    }else if(o.ozet.bilinen)t.push(tile({cls:"sakin",ik:"zil",bas:"En uzun bekleyen",orta:true,deger:"Yok",alt:"Bekleyen masa yok"}));
    else t.push(tile({ik:"zil",bas:"En uzun bekleyen",orta:true,deger:"–",alt:"Masa durumu bilinmiyor"}));
  }
  if(o.kasa)t.push(tile({ik:"sira",bas:"Kasa sırası",deger:sayi(o.kasa.sira)?`${say(o.kasa.sira)}<small>kişi</small>`:"–",alt:sayi(o.kasa.bekleme_sn)?`Bekleme ${sure(o.kasa.bekleme_sn)}`:"Bekleme süresi –"}));
  const html=t.join("");
  const el=$("kpi");if(el.dataset.html!==html){el.innerHTML=html;el.dataset.html=html}
}
function tekGuncelle(k){
  if(!k)return;
  const d=kameraDurum(k);
  $("kamAd").textContent=k.ad;
  $("kamCip").innerHTML=`<span class="cip k-${d.sev}">${ik(d.sev==="ok"?"dolu":d.sev==="off"?"durdu":"uyari")}${esc(d.ad)}</span>`.replace(ik("dolu"),`<span style="width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;margin:0 2px"></span>`)+fpsHtml(k);
  const ozet=masaOzet(k.masalar);
  kpiCiz({musteri:k.simdi.musteri,calisan:k.simdi.calisan,kisi:k.simdi.kisi,ozet,ortKalis:k.bugun.ort_kalis_sn,oturum:k.bugun.oturum,
    bekleyen:enUzunBekleyen(k.masalar.map(m=>({m,k}))),kasa:k.kasa,cokKamera:false});
  CERCEVELER.forEach(f=>katmanCiz(f,k));
  // masa listesi
  $("masaNot").textContent=!k.masalar.length?"":!ozet.bilinen?"Masa durumu bilinmiyor":`${ozet.dolu_toplam} dolu · ${ozet.bos} boş${ozet.kirli?` · ${ozet.kirli} kirli`:""}${ozet.bekliyor?` · ${ozet.bekliyor} bekliyor`:""}`;
  const sirali=[...k.masalar].sort((a,b)=>{
    const sa=masaBilgi(a.durum).sira,sb=masaBilgi(b.durum).sira;
    if(sa!==sb)return sa-sb;
    if(sa<=2)return (b.sure_sn??-1)-(a.sure_sn??-1);
    return dogal(a.ad,b.ad);
  });
  const mhtml=sirali.length?sirali.map(m=>{
    const dd=masaDurum(m.durum),b=masaBilgi(m.durum);
    return `<div class="masa m-${dd}"><div class="m-ust"><b title="${esc(m.ad)}">${esc(m.ad)}</b><span class="cip c-${dd}">${ik(b.ik)}${b.ad}</span></div>
      <div class="m-alt"><span class="m-sure" data-sure="${sayi(m.sure_sn)?m.sure_sn:""}" data-kod="${esc(k.kod)}">${sure(m.sure_sn)}</span><span>${dd==="bos"||dd==="kirli"?(dd==="kirli"?"temizlenmedi":"&nbsp;"):`${sayi(m.kisi)?m.kisi+" kişi":"– kişi"}`}</span></div></div>`;
  }).join(""):`<div class="bos-not" style="grid-column:1/-1">Bu kamerada masa çizilmemiş. Masaları başlangıç sayfasındaki <b>Masaları çiz</b> adımıyla ekleyebilirsiniz.</div>`;
  const ml=$("masalar");if(ml.dataset.html!==mhtml){ml.innerHTML=mhtml;ml.dataset.html=mhtml}
  $("lejant").classList.toggle("gizli",!k.masalar.length);
  bugunCiz(k.bugun,k.saatlik,k.masalar.length>0);
  uyariCiz(k.uyarilar.map(u=>({...u})),false);
}

/* --------------------------------------------- tüm kameralar */
function topla(vals){const v=vals.filter(sayi);return v.length?v.reduce((a,b)=>a+b,0):null}
function genelGuncelle(kam){
  const tumMasa=kam.flatMap(k=>k.masalar.map(m=>({m,k})));
  const ozet=masaOzet(tumMasa.map(x=>x.m));
  // ortalama kalış: oturum sayısıyla ağırlıklı
  let ag=0,top=0;kam.forEach(k=>{const b=k.bugun;if(sayi(b.ort_kalis_sn)&&sayi(b.oturum)&&b.oturum>0){ag+=b.oturum;top+=b.ort_kalis_sn*b.oturum}});
  const kasalar=kam.filter(k=>k.kasa);
  const kasa=kasalar.length?{sira:topla(kasalar.map(k=>k.kasa.sira)),bekleme_sn:kasalar.map(k=>k.kasa.bekleme_sn).filter(sayi).reduce((a,b)=>Math.max(a,b),-1)}:null;
  if(kasa&&kasa.bekleme_sn<0)kasa.bekleme_sn=null;
  kpiCiz({musteri:topla(kam.map(k=>k.simdi.musteri)),calisan:topla(kam.map(k=>k.simdi.calisan)),kisi:topla(kam.map(k=>k.simdi.kisi)),
    calisanAlt:`${kam.length} kamera toplamı`,ozet,ortKalis:ag?top/ag:null,oturum:ag?ag:topla(kam.map(k=>k.bugun.oturum)),
    bekleyen:enUzunBekleyen(tumMasa),kasa,cokKamera:true});
  // kamera kartları
  document.querySelectorAll("#kamIzgara .kam-kart").forEach(b=>{
    const k=kam.find(x=>x.kod===b.dataset.kod);if(!k)return;
    const f=CERCEVELER.find(x=>x.el.parentNode===b);if(f)katmanCiz(f,k);
    const d=kameraDurum(k),o=masaOzet(k.masalar);
    const html=`<div class="kk-ust"><b>${esc(k.ad)}</b><span class="cip k-${d.sev}">${d.sev==="ok"?`<span style="width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;margin:0 2px"></span>`:ik(d.sev==="off"?"durdu":"uyari")}${esc(d.ad)}</span></div>
      <div class="kk-say"><div><small>Müşteri</small><b>${say(k.simdi.musteri)}</b></div><div><small>Çalışan</small><b>${say(k.simdi.calisan)}</b></div>
      <div><small>Dolu masa</small><b>${o.toplam?`${o.dolu_toplam}/${o.toplam}`:"–"}</b></div>
      <div><small>${k.kasa?"Kasa sırası":"Bekleyen"}</small><b>${k.kasa?say(k.kasa.sira):(o.toplam?o.bekliyor:"–")}</b></div></div>
      ${fpsHtml(k)?`<div class="kk-fps">${fpsHtml(k)}</div>`:""}
      ${d.sev!=="ok"&&(k.mesaj||d.uzun)?`<div class="kk-mesaj">${esc(k.mesaj||d.uzun)}</div>`:""}`;
    const g=b.querySelector(".kk-govde");if(g.dataset.html!==html){g.innerHTML=html;g.dataset.html=html}
  });
  // bugün (toplam)
  const b={oturum:topla(kam.map(k=>k.bugun.oturum)),ort_kalis_sn:ag?top/ag:null,musteri:topla(kam.map(k=>k.bugun.musteri)),terk:topla(kam.map(k=>k.bugun.terk))};
  const dk=kam.filter(k=>k.masalar.length&&sayi(k.bugun.doluluk_yuzde));
  let mt=0,mtop=0;dk.forEach(k=>{mt+=k.masalar.length;mtop+=k.bugun.doluluk_yuzde*k.masalar.length});
  b.doluluk_yuzde=mt?mtop/mt:null;
  // saatlik: masa sayısıyla ağırlıklı doluluk, müşteri toplamı
  const saatler=new Map();
  kam.forEach(k=>k.saatlik.forEach(s=>{
    const e=saatler.get(s.saat)||{saat:s.saat,dt:0,dn:0,musteri:null};
    if(sayi(s.doluluk_yuzde)&&k.masalar.length){e.dt+=s.doluluk_yuzde*k.masalar.length;e.dn+=k.masalar.length}
    if(sayi(s.musteri))e.musteri=(e.musteri||0)+s.musteri;
    saatler.set(s.saat,e);
  }));
  const saatlik=[...saatler.values()].map(e=>({saat:e.saat,doluluk_yuzde:e.dn?e.dt/e.dn:null,musteri:e.musteri}));
  bugunCiz(b,saatlik,tumMasa.length>0,"Tüm kameralar");
  uyariCiz(kam.flatMap(k=>k.uyarilar.map(u=>({...u,kamera:k.ad}))),true);
}

/* --------------------------------------------- bugün + saatlik grafik */
function bugunCiz(b,saatlik,masaVar,not){
  $("bugunNot").textContent=not||"";
  const html=[["Oturum",say(b.oturum)],["Ort. kalış",kisaSure(b.ort_kalis_sn)],["Doluluk",masaVar?yuzde(b.doluluk_yuzde):"–"],["Müşteri",say(b.musteri)],["Terk",say(b.terk),"Servis beklemeden ayrılan masa"]]
    .map(([a,v,t])=>`<div${t?` title="${t}"`:""}><small>${a}</small><b>${v}</b></div>`).join("");
  const el=$("bugun");if(el.dataset.html!==html){el.innerHTML=html;el.dataset.html=html}
  const g=$("grafik"),gh=grafik(saatlik,masaVar);
  if(g.dataset.html!==gh){g.innerHTML=gh;g.dataset.html=gh}
}
function grafik(saatlik,masaVar){
  const s=[...saatlik].sort((a,b)=>a.saat-b.saat);
  if(!masaVar)return `<div class="bos-not">Saatlik doluluk, masası çizilmiş kameralarda görünür.</div>`;
  if(!s.some(x=>sayi(x.doluluk_yuzde)))return `<div class="bos-not">Henüz saatlik veri yok.</div>`;
  const simdi=new Date().getHours();

/* --------------------------------------------- uyarılar */
function uyariTur(u){
  const t=((u.tur||"")+" "+(u.metin||"")).toLocaleLowerCase("tr");
  if(/terk|ayrıl|ayril|gitti/.test(t))return {ik:"kapi",cls:"ter",ad:"Terk"};
  if(/kirli|temiz/.test(t))return {ik:"kirli",cls:"kir",ad:"Kirli masa"};
  if(/kasa|sıra|sira|kuyruk/.test(t))return {ik:"sira",cls:"kas",ad:"Kasa"};
  if(/bekle|garson|servis|ilgi/.test(t))return {ik:"zil",cls:"bek",ad:"Bekleyen masa"};
  if(/kamera|bağlantı|baglanti|kopt/.test(t))return {ik:"kamera-yok",cls:"",ad:"Kamera"};
  return {ik:"bilgi",cls:"",ad:u.tur?String(u.tur).replace(/[_-]+/g," "):"Bilgi"};
}
function uyariCiz(liste,cok){
  liste=liste.filter(u=>u.metin||u.tur);
  if(cok)liste.sort((a,b)=>String(b.zaman||"").localeCompare(String(a.zaman||"")));
  liste=liste.slice(0,20);
  const el=$("uyarilar");
  const anahtar=u=>[u.kamera||"",u.zaman,u.tur,u.masa,u.metin].join("|");
  const html=liste.length?liste.map(u=>{
    const t=uyariTur(u),a=anahtar(u),yeni=!S.ilkUyari&&!S.gorulenUyari.has(a);
    return `<li class="${yeni?"yeni":""}" data-a="${esc(a)}"><time>${esc(u.zaman||"–")}</time><span class="u-ik ${t.cls}" title="${esc(t.ad)}">${ik(t.ik)}</span><div class="u-metin">${esc(u.metin||t.ad)}<small>${[t.ad,u.masa?esc(u.masa):"",u.kamera?esc(u.kamera):""].filter(Boolean).join(" · ")}</small></div></li>`;
  }).join(""):`<li style="display:block"><div class="bos-not">Henüz uyarı yok. Bekleyen ya da kirli kalan bir masa olduğunda burada görünür.</div></li>`;
  const imza=liste.map(anahtar).join("\n");
  if(el.dataset.imza!==imza){el.innerHTML=html;el.dataset.imza=imza}
  liste.forEach(u=>S.gorulenUyari.add(anahtar(u)));
  S.ilkUyari=false;
}

/* ============================================================ saniyelik tık: saat, veri yaşı, sayaçlar */
function tik(){
  KK.saatTik();
  // veri yaşı
  const y=$("canli").querySelector(".yas");
  if(S.alindi){
    let yas=(Date.now()-S.alindi)/1000;
    if(!apiKoptu()&&S.veri&&S.veri.kameralar.length){
      const gor=S.secim==="tum"?S.veri.kameralar:S.veri.kameralar.filter(k=>k.kod===S.secim);
      const ys=gor.map(kareYasi).filter(sayi);
      if(ys.length)yas=Math.max(...ys);
    }
    y.textContent="· "+(yas<2.5?"şimdi":sure(yas)+" önce");
  }else y.textContent="";
  // sayaçlar: yalnızca veri taze ve kamera çalışıyorken ilerler
  const gecen=S.alindi?(Date.now()-S.alindi)/1000:0;
  const kam=S.veri?S.veri.kameralar:[];
  document.querySelectorAll("[data-sure]").forEach(el=>{
    const b=el.dataset.sure;if(b===""){el.textContent="–";return}
    const k=kam.find(x=>x.kod===el.dataset.kod);
    const ilerle=k&&k.durum==="calisiyor"&&!apiKoptu()&&!(sayi(kareYasi(k))&&kareYasi(k)>=ESKI_SN);
    el.textContent=sure(+b+(ilerle?Math.min(gecen,6):0));
  });
  // kare yaşı rozetleri
  CERCEVELER.forEach(f=>{
    const k=kam.find(x=>x.kod===f.kod);if(!k)return;
    const ky=kareYasi(k),goruntuYas=f.son?(Date.now()-f.son)/1000:null;
    const yas=Math.max(sayi(ky)?ky:0,sayi(goruntuYas)?goruntuYas:0);
    const eski=f.el.classList.contains("var")&&(yas>=ESKI_SN||k.durum==="koptu"||k.durum==="durdu"||k.durum==="hata");
    f.el.classList.toggle("eski",eski);
    f.yas.classList.toggle("goster",eski);
    if(eski)f.yas.querySelector("span").textContent=`Görüntü ${sure(yas)} önce`;
  });
}
setInterval(tik,1000);
